# M5 整合业务契约版；可重新运行 tools/build_m5_dify_workflows.py 生成。
# 导入后核对模型供应商、凭据与发布状态；离线校验不代表真实Dify联调通过。
app:
  description: 整合业务契约版：普通日报多轮收集与核实查询；不接收心理、投诉明细或专项事件引用；状态和提交由后端管理
