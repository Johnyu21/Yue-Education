# =====================================================================
# WF_STUDENT —— 学生智能助手工作流（Dify 1.12.1）
#
# 导入说明：
#   1. LLM 节点（id: llm）的 model.provider / model.name 已留空，导入后自行选择大模型。
#   2. 知识检索节点（id: knowledge）dataset_ids 已留空，编写 RAG 文档后在画布上绑定学生知识库
#      （数据集是工作区资源，DSL 无法跨环境携带，导入后节点会显示"未配置"属正常）。
#   3. 契约：Start 输入 payload_json（字符串 JSON），End 输出 output_json（字符串 JSON）。
#      后端适配器 POST /v1/workflows/run，读取 data.outputs.output_json 后按 Schema 校验。
#   4. 导入时提示"DSL 版本差异"为正常警告，不影响使用。
# =====================================================================
app:
  description: 学生智能助手 WF_STUDENT —— 学务查询 / 生活问答 / 申请草稿 / 售后草稿 / 情绪观测
  icon: 🤖
  icon_background: '#E4FBCC'
  mode: workflow
  name: WF_STUDENT
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - remote_url
          - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: knowledge-retrieval
        id: edge-start-knowledge
        source: start
        sourceHandle: source
        target: knowledge
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: edge-knowledge-llm
        source: knowledge
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          variables:
            - label: payload_json
              max_length: 20000
              options: []
              required: true
              type: paragraph
              variable: payload_json
        height: 116
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          dataset_ids: []
          desc: ''
          multiple_retrieval_config:
            reranking_enable: false
            reranking_model:
              reranking_model_name: ''
              reranking_provider_name: ''
            score_threshold: null
            score_threshold_enabled: false
            top_k: 4
          query_variable_selector:
            - start
            - payload_json
          retrieval_mode: multiple
          selected: false
          title: 学生知识库检索
          type: knowledge-retrieval
        height: 92
        id: knowledge
        position:
          x: 380
          y: 282
        positionAbsolute:
          x: 380
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: true
            variable_selector:
              - knowledge
              - result
          desc: ''
          model:
            completion_params:
              temperature: 0.3
            mode: chat
            name: ''
            provider: ''
          prompt_template:
            - id: sys-prompt-student
              role: system
              text: |
                你是粤教留学的学生智能助手。输入 payload_json 是 JSON 字符串，包含：
                { "message": 学生消息, "message_id": 消息ID, "input_kind": "CHAT|CHECK_IN",
                  "observe_emotion": 是否允许情绪观测, "student": {本人学务事实}, "context": {...} }。

                请完成以下任务，并**只输出一个合法 JSON 对象**（不要输出解释、不要 markdown 代码块）：
                {
                  "schema_version": "1.0",
                  "answer": "给学生看的自然语言回答（写操作只给核对话术，不说已提交）",
                  "intent": "QUERY|FAQ|SERVICE_DRAFT|FEEDBACK_DRAFT|UPGRADE_INTEREST|OTHER",
                  "draft": null 或 {草稿字段，仅写意图时给出},
                  "missing_fields": [缺项字段名],
                  "sources": [{document_id, title, section}],
                  "warnings": [提示],
                  "observation": { "emotion_state": "HEALTHY|NEGATIVE|VERY_NEGATIVE|UNKNOWN",
                                   "direct_signal": false, "confidence": 0.0 }
                }

                规则：
                1. 学务查询（成绩/日程/进度/概览）只基于 payload_json.student 内已提供的事实回答，缺资料就明说，不编造。
                2. 生活问答优先使用知识库检索结果，检索不到就说明资料不足，不编造机构/联系方式。
                3. 请假/考务/信息修改 → intent=SERVICE_DRAFT，draft 给出 {service_type, title, description, start_at, end_at}；缺项放 missing_fields，并追问，不提交。
                4. 投诉/建议/咨询 → intent=FEEDBACK_DRAFT，draft 给出 {category, subject, teacher_name, project_category, content}。
                5. 升学意向 → intent=UPGRADE_INTEREST，draft 给出 {course_project_id}；仅展示已发布项目，学生明确愿意联系顾问才产出。
                6. observe_emotion=true 时才在 observation 给出情绪判断（HEALTHY/NEGATIVE/VERY_NEGATIVE/UNKNOWN）；否则 observation=null。
                7. 任何文本"已提交/已办理"都不是业务回执，后端会真正落单，你不能替后端下结论。
            - id: user-prompt-student
              role: user
              text: '{{#start.payload_json#}}'
          selected: false
          title: 学生助手
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: llm
        position:
          x: 680
          y: 282
        positionAbsolute:
          x: 680
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - llm
                - text
              variable: output_json
          selected: false
          title: 结束
          type: end
        height: 90
        id: end
        position:
          x: 980
          y: 282
        positionAbsolute:
          x: 980
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
