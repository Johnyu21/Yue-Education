app:
  description: 学生助手受控意图草稿；不携带JWT，不执行HTTP或数据库写入。待绑定模型后联调。
  icon: 📋
  icon_background: '#E4FBCC'
  mode: workflow
  name: WF_STUDENT
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: edge-start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: edge-llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: payload_json
          max_length: 50000
          options: []
          required: true
          type: paragraph
          variable: payload_json
      height: 116
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: student-system
          role: system
          text: 仅输出JSON对象。schema_version=1.0。intent只能是PROFILE_QUERY/SCORE_QUERY/SCHEDULE_QUERY/CASE_QUERY/ASSESSMENT_QUERY/FAQ/SERVICE_DRAFT/FEEDBACK_DRAFT/UPGRADE_INTEREST/OTHER。输出answer、draft、missing_fields、sources。信息不足时追问，不编造。写操作仅草稿，不声称已提交，不生成JWT或调用接口。仅当输入observe_emotion=true时可输出observation，包含emotion_state=HEALTHY/NEGATIVE/VERY_NEGATIVE/UNKNOWN和0到1的confidence；不得作医学诊断。
        - id: student-input
          role: user
          text: '{{#start.payload_json#}}'
        selected: false
        title: 学生意图和草稿
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: llm
      position:
        x: 480
        y: 282
      positionAbsolute:
        x: 480
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - llm
          - text
          variable: output_json
        selected: false
        title: 结束
        type: end
      height: 90
      id: end
      position:
        x: 780
        y: 282
      positionAbsolute:
        x: 780
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
