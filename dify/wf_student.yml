        prompt_template:
        - id: a1111111-1111-4111-8111-111111111111
          role: system
          text: |
            你是学生意图分类器。根据学生消息，只输出一个 JSON 对象（不要解释、不要代码块）：
            {"intent": "PROFILE_QUERY|SCORE_QUERY|SCHEDULE_QUERY|CASE_QUERY|ASSESSMENT_QUERY|FAQ|SERVICE_DRAFT|FEEDBACK_DRAFT|UPGRADE_INTEREST|OTHER"}
            分类规则：
            - PROFILE_QUERY：查本人档案、班级、顾问、课程项目
            - SCORE_QUERY：查本人成绩
            - SCHEDULE_QUERY：查考试、DDL、日程
            - CASE_QUERY：查申请进度
            - ASSESSMENT_QUERY：查签约前评估结果
            - FAQ：海外生活、签证、租房、留学政策等通用知识问答
            - SERVICE_DRAFT：请假、申请缓考、信息修改等行政申请
            - FEEDBACK_DRAFT：投诉、建议、咨询
            - UPGRADE_INTEREST：对升学项目感兴趣、想联系顾问
            - OTHER：其他闲聊
        - id: a1111111-1111-4111-8111-111111111112
          role: user
          text: '{{#1.payload_json#}}'
        reasoning_format: separated
        selected: false
        structured_output_enabled: false
        title: 意图分类
        type: llm
        vision:
          enabled: false
      height: 98
      id: '2'
      position:
        x: 380
        y: 400
      positionAbsolute:
        x: 380
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(payload_json: str, classify_text: str):\n    try:\n        cls = json.loads(classify_text)\n        intent = str(cls.get('intent') or 'OTHER').strip().upper()\n    except Exception:\n        intent = 'OTHER'\n    try:\n        pl = json.loads(payload_json)\n        auth_token = pl.get('auth_token', '')\n        message = pl.get('message', '')\n        observe = pl.get('observe_emotion', False)\n    except Exception:\n        auth_token = ''\n        message = ''\n        observe = False\n    return {'intent': intent, 'auth_token': auth_token, 'message': message, 'observe_emotion': 'true' if observe else 'false'}\n"
        code_language: python3
        outputs:
          intent:
            children: null
            type: string
          auth_token:
            children: null
            type: string
          message:
            children: null
            type: string
          observe_emotion:
            children: null
            type: string
        selected: false
        title: 解析意图与鉴权
        type: code
