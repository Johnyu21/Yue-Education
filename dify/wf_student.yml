# =====================================================================
# WF_STUDENT —— 学生智能助手（Dify 1.12.1 · Workflow 工作流）
#
# 核心：Dify 工作流内用 HTTP 节点【直接调用后端业务接口】：
#   查询类 → HTTP GET 后端接口拿真实数据；写操作 → LLM 提取参数 + 代码组装 body + HTTP POST 后端接口真正落单。
# 鉴权：学生 JWT 由后端 API030 放进 payload_json.auth_token，HTTP 节点请求头带 Authorization: Bearer。
#
# 部署说明：
#   - environment_variables.backend_base_url 默认 http://192.168.88.1:8000/api/v1，
#     请改成后端能被 Dify 访问到的实际地址（含 /api/v1）。
#   - 知识检索节点 dataset_ids 留空，编写 RAG 文档后绑定学生知识库。
#   - LLM 节点已填 deepseek-flash（langgenius/deepseek/deepseek）。
# =====================================================================
