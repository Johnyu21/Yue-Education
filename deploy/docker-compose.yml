# =============================================================================
# 教育服务智能体平台 · 本地开发环境
# =============================================================================
# 用途：一键在本地起数据库（+ 网页版数据库查看器）
#
# 用法（每个开发者在自己的电脑上执行）：
#   docker compose up -d        # 启动（第一次会自动建库建表）
#   docker compose down         # 停止（数据保留）
#   docker compose down -v      # 停止并删除数据（想彻底重来用）
#   docker compose logs -f db   # 看数据库日志
#
# 连数据库信息：
#   主机 localhost   端口 5432   库 education   用户 postgres   密码 edu_dev_2026
#   网页版查看器：http://localhost:8080
#
# 说明：
#   1. 使用 named volume 持久化数据，重启不丢
#   2. schema.sql 会在"首次启动、数据卷为空"时自动执行，建好 19 张表
#   3. 改了 schema.sql 后想重新建表 → 先 docker compose down -v 再 up
#      （因为初始化脚本只在空库时运行一次）
#   4. 时区统一 UTC（与 00-环境与技术选型.md 的约定一致）
#   5. 所有配置可用 .env 覆盖（可选），默认值见下方 ${VAR:-default}
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 数据库：PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: edu-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-education}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 首次启动时自动执行建表脚本（挂在 init 目录）
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # 让 adminer / 后端可以等数据库就绪
      test:
        ["CMD-SHELL",
         "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-education}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 数据库网页查看器 Adminer（可选，打开浏览器即可看表，无需装 DBeaver）
  # 不需要的话，把这一段删掉即可，不影响数据库使用
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: edu-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
