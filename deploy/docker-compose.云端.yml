# =============================================================================
# 教育服务智能体平台 · 云端数据库（腾讯云服务器）
# =============================================================================
# 用途：在云服务器上一键起 PostgreSQL，供全组连接开发
#
# 用法（在服务器上执行）：
#   1. 把本文件、schema.sql、.env 放在同一个目录
#   2. docker compose up -d
#
# ── 与"本地版"的三处区别 ──────────────────────────────────────────────
#   ① 密码不写死，从 .env 读（云上不能用开发密码）
#   ② 端口默认绑 127.0.0.1（不对公网裸奔）
#   ③ 去掉了 Adminer（云上不需要网页查看器）
#
# ⚠️ 重要提醒
#   1. 必须在同目录建 .env 文件（见下方模板），否则起不来
#   2. 如果队友需要直连数据库，改下面 DB_BIND（见注释）
#   3. 安全组不要开 0.0.0.0/0 的 5432
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 数据库：PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: edu-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 没有默认值：.env 里不填就报错，防止误用开发密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-education}
      TZ: UTC
      PGTZ: UTC
    ports:
      # ─────────────────────────────────────────────────────────────
      # 默认：只允许本机连（后端和库同机时，最安全）
      # 如果要让队友直连（他们连服务器的数据库）：
      #   把下面一行改成  "${DB_BIND:-0.0.0.0}:5432:5432"
      #   然后在安全组里「只放行队友的 IP」，不要开 0.0.0.0/0
      # ─────────────────────────────────────────────────────────────
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 首次启动时自动执行建表脚本（19 张表）
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL",
         "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-education}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: edu_pgdata   # 固定卷名，方便备份/迁移

# =============================================================================
# .env 文件模板（放在同目录，文件名就叫 .env）
# -----------------------------------------------------------------------------
#   POSTGRES_USER=postgres
#   POSTGRES_PASSWORD=换成你的强密码
#   POSTGRES_DB=education
#   # 队友要直连时取消下面注释：
#   # DB_BIND=0.0.0.0
#
# ⚠️ .env 不要提交到 git（含密码）
# =============================================================================
